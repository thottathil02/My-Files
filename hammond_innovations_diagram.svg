<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .hub-text { font-family: Arial, sans-serif; font-size: 56px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: white; }
      .care-label { font-family: Arial, sans-serif; font-size: 32px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: white; }
      .enabling-label { font-family: Arial, sans-serif; font-size: 26px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: white; }
      .ring-label { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; letter-spacing: 3px; text-anchor: middle; dominant-baseline: middle; fill: #2D1B4E; }
      .dot { fill: white; }
    </style>
  </defs>
  
  <!-- OUTER DOTTED CIRCLE for ENABLING UNITS label -->
  <circle cx="500" cy="500" r="680" fill="none" stroke="#2D1B4E" stroke-width="2" stroke-dasharray="12,8"/>
  
  <!-- INNER DOTTED CIRCLE for CARE UNITS label -->
  <circle cx="500" cy="500" r="370" fill="none" stroke="#2D1B4E" stroke-width="2" stroke-dasharray="12,8"/>
  
  <!-- ============== ENABLING RING (6 × 60°) ============== -->
  <!-- Each segment is 60 degrees, positioned at: 0, 60, 120, 180, 240, 300 degrees -->
  
  <!-- Segment 1: Finance (330° to 30° / -30° to 30°) -->
  <path d="M 500 500 L 500 150 A 350 350 0 0 1 803.5 233 Z" fill="#FF8C00" stroke="white" stroke-width="3"/>
  
  <!-- Segment 2: People (30° to 90°) -->
  <path d="M 500 500 L 803.5 233 A 350 350 0 0 1 950 500 Z" fill="#FF8C00" stroke="white" stroke-width="3"/>
  
  <!-- Segment 3: Risk (90° to 150°) -->
  <path d="M 500 500 L 950 500 A 350 350 0 0 1 803.5 767 Z" fill="#FF8C00" stroke="white" stroke-width="3"/>
  
  <!-- Segment 4: Marketing (150° to 210°) -->
  <path d="M 500 500 L 803.5 767 A 350 350 0 0 1 500 850 Z" fill="#FF8C00" stroke="white" stroke-width="3"/>
  
  <!-- Segment 5: Pastoral Care & Volunteers (210° to 270°) -->
  <path d="M 500 500 L 500 850 A 350 350 0 0 1 196.5 767 Z" fill="#FF8C00" stroke="white" stroke-width="3"/>
  
  <!-- Segment 6: Technology (270° to 330°) -->
  <path d="M 500 500 L 196.5 767 A 350 350 0 0 1 50 500 Z" fill="#FF8C00" stroke="white" stroke-width="3"/>
  
  <!-- Segment 1 continued: Finance (330° to 360° and 0° to 30°) -->
  <path d="M 500 500 L 50 500 A 350 350 0 0 1 196.5 233 Z" fill="#FF8C00" stroke="white" stroke-width="3"/>
  
  <!-- Fix: Complete first segment -->
  <path d="M 500 500 L 196.5 233 A 350 350 0 0 1 500 150 Z" fill="#FF8C00" stroke="white" stroke-width="3"/>
  
  <!-- ============== WHITE SPACER RING ============== -->
  <circle cx="500" cy="500" r="385" fill="white" stroke="none"/>
  <circle cx="500" cy="500" r="370" fill="none" stroke="white" stroke-width="30"/>
  
  <!-- ============== CARE RING (4 × 90°) ============== -->
  <!-- Segment 1: Home Care (315° to 45° / -45° to 45°) -->
  <path d="M 500 500 L 500 200 A 300 300 0 0 1 712 288 Z" fill="#2D1B4E" stroke="white" stroke-width="3"/>
  
  <!-- Segment 2: HealthCare & Hospitals (45° to 135°) -->
  <path d="M 500 500 L 712 288 A 300 300 0 0 1 712 712 Z" fill="#2D1B4E" stroke="white" stroke-width="3"/>
  
  <!-- Segment 3: Advisory Care & Partnerships (135° to 225°) -->
  <path d="M 500 500 L 712 712 A 300 300 0 0 1 288 712 Z" fill="#2D1B4E" stroke="white" stroke-width="3"/>
  
  <!-- Segment 4: Residential Care (225° to 315°) -->
  <path d="M 500 500 L 288 712 A 300 300 0 0 1 288 288 Z" fill="#2D1B4E" stroke="white" stroke-width="3"/>
  
  <!-- Segment 4 continued: Residential Care (315° to 360°) -->
  <path d="M 500 500 L 288 288 A 300 300 0 0 1 500 200 Z" fill="#2D1B4E" stroke="white" stroke-width="3"/>
  
  <!-- ============== CENTRE HUB ============== -->
  <circle cx="500" cy="500" r="140" fill="#999999" stroke="white" stroke-width="4"/>
  
  <!-- ============== CARE RING LABELS + ICONS ============== -->
  <!-- Home Care (Top) -->
  <g>
    <text x="500" y="270" class="care-label">Home Care</text>
    <circle cx="500" cy="245" r="10" class="dot"/>
  </g>
  
  <!-- HealthCare & Hospitals (Right) -->
  <g>
    <text x="720" y="550" class="care-label" font-size="28">HealthCare &amp;</text>
    <text x="720" y="585" class="care-label" font-size="28">Hospitals</text>
    <circle cx="720" cy="500" r="10" class="dot"/>
  </g>
  
  <!-- Advisory Care & Partnerships (Bottom) -->
  <g>
    <text x="500" y="760" class="care-label" font-size="28">Advisory Care &amp;</text>
    <text x="500" y="795" class="care-label" font-size="28">Partnerships</text>
    <circle cx="500" cy="755" r="10" class="dot"/>
  </g>
  
  <!-- Residential Care (Left) -->
  <g>
    <text x="280" y="550" class="care-label" font-size="28">Residential</text>
    <text x="280" y="585" class="care-label" font-size="28">Care</text>
    <circle cx="280" cy="500" r="10" class="dot"/>
  </g>
  
  <!-- ============== ENABLING RING LABELS + ICONS ============== -->
  <!-- Finance (Top-Right, ~30°) -->
  <g>
    <text x="620" y="140" class="enabling-label">Finance</text>
    <circle cx="620" cy="115" r="9" class="dot"/>
  </g>
  
  <!-- People (Right, ~90°) -->
  <g>
    <text x="870" y="280" class="enabling-label">People</text>
    <circle cx="870" cy="255" r="9" class="dot"/>
  </g>
  
  <!-- Risk (Bottom-Right, ~150°) -->
  <g>
    <text x="820" y="840" class="enabling-label">Risk</text>
    <circle cx="820" cy="865" r="9" class="dot"/>
  </g>
  
  <!-- Marketing (Bottom, ~210°) -->
  <g>
    <text x="500" y="920" class="enabling-label">Marketing</text>
    <circle cx="500" cy="955" r="9" class="dot"/>
  </g>
  
  <!-- Pastoral Care & Volunteers (Bottom-Left, ~270°) -->
  <g>
    <text x="180" y="840" class="enabling-label" font-size="22">Pastoral Care</text>
    <text x="180" y="870" class="enabling-label" font-size="22">&amp; Volunteers</text>
    <circle cx="180" cy="865" r="9" class="dot"/>
  </g>
  
  <!-- Technology (Left, ~330°) -->
  <g>
    <text x="130" y="280" class="enabling-label">Technology</text>
    <circle cx="130" cy="255" r="9" class="dot"/>
  </g>
  
  <!-- ============== CENTRE HUB TEXT ============== -->
  <text x="500" y="480" class="hub-text">Hammond</text>
  <text x="500" y="540" class="hub-text">Innovations</text>
  
  <!-- ============== RING LABELS ============== -->
  <!-- CARE UNITS (top of inner dotted circle) -->
  <text x="500" y="330" class="ring-label">CARE UNITS</text>
  
  <!-- ENABLING UNITS (bottom of outer dotted circle) -->
  <text x="500" y="740" class="ring-label">ENABLING UNITS</text>
</svg>