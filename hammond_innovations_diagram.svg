<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .hub-text { font-family: Arial, sans-serif; font-size: 48px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: white; }
      .care-label { font-family: Arial, sans-serif; font-size: 28px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: white; }
      .enabling-label { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: white; }
      .ring-text { font-family: Arial, sans-serif; font-size: 26px; font-weight: bold; letter-spacing: 2px; text-anchor: middle; dominant-baseline: middle; fill: #2D1B4E; }
      .dot { fill: white; }
    </style>
  </defs>
  
  <!-- Perfect concentric circles centered at (500, 500) -->
  <!-- Hub: r=140, Care: r=140-310, Spacer: r=310-340, Enabling: r=340-640 -->
  
  <!-- Outer dotted ring for ENABLING UNITS label (r=660) -->
  <circle cx="500" cy="500" r="660" fill="none" stroke="#2D1B4E" stroke-width="2" stroke-dasharray="10,6"/>
  
  <!-- Inner dotted ring for CARE UNITS label (r=330) -->
  <circle cx="500" cy="500" r="330" fill="none" stroke="#2D1B4E" stroke-width="2" stroke-dasharray="10,6"/>
  
  <!-- ============== ENABLING RING (6 × 60° segments) ============== -->
  <!-- All segments from r=340 to r=640, centered at (500, 500) -->
  
  <!-- Segment 1: Finance (0° to 60°, top-right) -->
  <path d="M 500 500 L 500 -140 A 640 640 0 0 1 1104.4 220 Z" fill="#FF8C00" stroke="white" stroke-width="2"/>
  
  <!-- Segment 2: People (60° to 120°, right) -->
  <path d="M 500 500 L 1104.4 220 A 640 640 0 0 1 1104.4 780 Z" fill="#FF8C00" stroke="white" stroke-width="2"/>
  
  <!-- Segment 3: Risk (120° to 180°, bottom-right) -->
  <path d="M 500 500 L 1104.4 780 A 640 640 0 0 1 500 1140 Z" fill="#FF8C00" stroke="white" stroke-width="2"/>
  
  <!-- Segment 4: Marketing (180° to 240°, bottom-left) -->
  <path d="M 500 500 L 500 1140 A 640 640 0 0 1 -104.4 780 Z" fill="#FF8C00" stroke="white" stroke-width="2"/>
  
  <!-- Segment 5: Pastoral Care & Volunteers (240° to 300°, left) -->
  <path d="M 500 500 L -104.4 780 A 640 640 0 0 1 -104.4 220 Z" fill="#FF8C00" stroke="white" stroke-width="2"/>
  
  <!-- Segment 6: Technology (300° to 360°, top-left) -->
  <path d="M 500 500 L -104.4 220 A 640 640 0 0 1 500 -140 Z" fill="#FF8C00" stroke="white" stroke-width="2"/>
  
  <!-- ============== WHITE SPACER RING ============== -->
  <circle cx="500" cy="500" r="340" fill="white" stroke="none"/>
  <circle cx="500" cy="500" r="310" fill="none" stroke="white" stroke-width="30"/>
  
  <!-- ============== CARE RING (4 × 90° segments) ============== -->
  <!-- All segments from r=140 to r=310, centered at (500, 500) -->
  
  <!-- Segment 1: Home Care (0° to 90°, top-right) -->
  <path d="M 500 500 L 500 190 A 310 310 0 0 1 719.3 280.7 Z" fill="#2D1B4E" stroke="white" stroke-width="2"/>
  
  <!-- Segment 2: HealthCare & Hospitals (90° to 180°, bottom-right) -->
  <path d="M 500 500 L 719.3 280.7 A 310 310 0 0 1 500 810 Z" fill="#2D1B4E" stroke="white" stroke-width="2"/>
  
  <!-- Segment 3: Advisory Care & Partnerships (180° to 270°, bottom-left) -->
  <path d="M 500 500 L 500 810 A 310 310 0 0 1 280.7 719.3 Z" fill="#2D1B4E" stroke="white" stroke-width="2"/>
  
  <!-- Segment 4: Residential Care (270° to 360°, top-left) -->
  <path d="M 500 500 L 280.7 719.3 A 310 310 0 0 1 500 190 Z" fill="#2D1B4E" stroke="white" stroke-width="2"/>
  
  <!-- ============== CENTRE HUB ============== -->
  <circle cx="500" cy="500" r="140" fill="#999999" stroke="white" stroke-width="4"/>
  
  <!-- ============== CARE RING LABELS & ICONS ============== -->
  
  <!-- Home Care (Top, 45°) -->
  <g>
    <text x="500" y="260" class="care-label">Home Care</text>
    <circle cx="500" cy="240" r="8" class="dot"/>
  </g>
  
  <!-- HealthCare & Hospitals (Right, 135°) -->
  <g>
    <text x="730" y="560" class="care-label" font-size="24">HealthCare &amp;</text>
    <text x="730" y="590" class="care-label" font-size="24">Hospitals</text>
    <circle cx="730" cy="500" r="8" class="dot"/>
  </g>
  
  <!-- Advisory Care & Partnerships (Bottom, 225°) -->
  <g>
    <text x="500" y="760" class="care-label" font-size="24">Advisory Care &amp;</text>
    <text x="500" y="790" class="care-label" font-size="24">Partnerships</text>
    <circle cx="500" cy="765" r="8" class="dot"/>
  </g>
  
  <!-- Residential Care (Left, 315°) -->
  <g>
    <text x="270" y="560" class="care-label" font-size="24">Residential</text>
    <text x="270" y="590" class="care-label" font-size="24">Care</text>
    <circle cx="270" cy="500" r="8" class="dot"/>
  </g>
  
  <!-- ============== ENABLING RING LABELS & ICONS ============== -->
  
  <!-- Finance (30°, top-right) -->
  <g>
    <text x="640" y="140" class="enabling-label">Finance</text>
    <circle cx="640" cy="120" r="7" class="dot"/>
  </g>
  
  <!-- People (90°, right) -->
  <g>
    <text x="900" y="280" class="enabling-label">People</text>
    <circle cx="900" cy="260" r="7" class="dot"/>
  </g>
  
  <!-- Risk (150°, bottom-right) -->
  <g>
    <text x="840" y="830" class="enabling-label">Risk</text>
    <circle cx="840" cy="850" r="7" class="dot"/>
  </g>
  
  <!-- Marketing (210°, bottom) -->
  <g>
    <text x="500" y="920" class="enabling-label">Marketing</text>
    <circle cx="500" cy="945" r="7" class="dot"/>
  </g>
  
  <!-- Pastoral Care & Volunteers (270°, left) -->
  <g>
    <text x="100" y="830" class="enabling-label" font-size="20">Pastoral Care</text>
    <text x="100" y="860" class="enabling-label" font-size="20">&amp; Volunteers</text>
    <circle cx="100" cy="850" r="7" class="dot"/>
  </g>
  
  <!-- Technology (330°, top-left) -->
  <g>
    <text x="100" y="280" class="enabling-label">Technology</text>
    <circle cx="100" cy="260" r="7" class="dot"/>
  </g>
  
  <!-- ============== CENTRE HUB TEXT ============== -->
  <text x="500" y="480" class="hub-text">Hammond</text>
  <text x="500" y="535" class="hub-text">Innovations</text>
  
  <!-- ============== RING LABELS ============== -->
  
  <!-- CARE UNITS (top of inner dotted ring) -->
  <text x="500" y="295" class="ring-text">CARE UNITS</text>
  
  <!-- ENABLING UNITS (bottom of outer dotted ring) -->
  <text x="500" y="765" class="ring-text">ENABLING UNITS</text>
  
</svg>